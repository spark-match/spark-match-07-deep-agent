name: deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev or production)'
        type: choice
        required: true
        default: 'dev'
        options:
          - dev
          - production

concurrency:
  group: deploy-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

# El GITHUB_TOKEN del caller es el techo de lo que el reusable puede pedir.
# `reusable-container-deploy-ecr.yml` declara `pull-requests: write` para su
# step `notify-deploy-failure`; sin concederlo aca, GitHub rechaza el run
# entero antes de arrancar (startup_failure, sin jobs ni logs).
permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # Nota: un job que llama un reusable solo admite name/uses/with/secrets/
  # needs/if/permissions. El gate de GH Environment lo enlaza el propio
  # reusable via inputs.environment-name.
  #
  # Las vars van con sufijo _DEV/_PROD y son repo-level, no environment-level:
  # una var de scope environment NO se resuelve en el `with:` de una llamada a
  # reusable, porque el environment se enlaza dentro del workflow llamado, no
  # aca. Con `vars.ECR_REPOSITORY` (environment-level) el input llegaba vacio y
  # el reusable moria en `Input validation failed: ecr-repository: required`.
  # spark-match-04-frontend ya documenta y aplica este mismo patron.
  deploy-dev:
    name: deploy (dev)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-container-deploy-ecr.yml@main
    with:
      environment-name: dev
      aws-region: us-east-1
      ecr-repository: ${{ vars.ECR_REPOSITORY_DEV }}
      dockerfile-path: Dockerfile
      platforms: linux/arm64
      image-tags-input: 'latest,__GITHUB_SHA_SHORT__'
      provenance: true
      sbom: true
      deploy-role-arn: ${{ vars.AWS_BEDROCK_AGENTCORE_DEPLOY_ROLE_ARN_DEV }}

  deploy-production:
    name: deploy (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-container-deploy-ecr.yml@main
    with:
      environment-name: production
      aws-region: us-east-1
      ecr-repository: ${{ vars.ECR_REPOSITORY_PROD }}
      dockerfile-path: Dockerfile
      platforms: linux/arm64
      image-tags-input: 'latest,__GITHUB_SHA_SHORT__,__GITHUB_REF_NAME__'
      provenance: true
      sbom: true
      deploy-role-arn: ${{ vars.AWS_BEDROCK_AGENTCORE_DEPLOY_ROLE_ARN_PROD }}

  deploy-manual:
    name: deploy (manual - ${{ github.event.inputs.environment }})
    if: github.event_name == 'workflow_dispatch'
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-container-deploy-ecr.yml@main
    with:
      environment-name: ${{ github.event.inputs.environment }}
      aws-region: us-east-1
      ecr-repository: >-
        ${{ github.event.inputs.environment == 'production'
        && vars.ECR_REPOSITORY_PROD
        || vars.ECR_REPOSITORY_DEV }}
      dockerfile-path: Dockerfile
      platforms: linux/arm64
      image-tags-input: 'latest,__GITHUB_SHA_SHORT__'
      provenance: true
      sbom: true
      deploy-role-arn: >-
        ${{ github.event.inputs.environment == 'production'
        && vars.AWS_BEDROCK_AGENTCORE_DEPLOY_ROLE_ARN_PROD
        || vars.AWS_BEDROCK_AGENTCORE_DEPLOY_ROLE_ARN_DEV }}
