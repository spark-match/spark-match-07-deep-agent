name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Union de lo que exigen los reusables de 01-devops: un caller debe
# concederle al workflow llamado al menos los permisos que este declara,
# o GitHub rechaza el run al arrancar ("requesting X, but is only
# allowed none"). python-ci pide pull-requests: write (comentario de
# coverage) y codeql pide actions: read + security-events: write (SARIF).
permissions:
  contents: read
  pull-requests: write
  actions: read
  security-events: write

jobs:
  python-ci:
    name: python-ci (ci)
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-python-ci.yml@main
    with:
      environment-name: ci
      working-directory: '.'
      runs-on: ubuntu-latest
      python-version: ${{ vars.DEFAULT_PYTHON_VERSION }}
      ruff-targets: 'src tests evals'
      mypy-targets: 'src'
      pytest-targets: 'tests'
      pytest-args: '--cov=src --cov-report=xml:coverage.xml --cov-fail-under=80'
      coverage-output: coverage.xml
      coverage-threshold: '80'

  sonar-python:
    name: sonar-python (ci)
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-sonar-python.yml@main
    with:
      project-key: ${{ vars.SONAR_PROJECT_KEY }}
      project-name: ${{ vars.SONAR_PROJECT_NAME }}
      organization: ${{ vars.SONAR_ORGANIZATION }}
      sources: 'src'
      tests: 'tests,evals'
      working-directory: '.'
      env: 'ci'
      python-version: ${{ vars.DEFAULT_PYTHON_VERSION }}
      sync-groups: 'dev'
      pytest-targets: 'tests'
      pytest-args: '--cov=src --cov-report=xml:coverage.xml --cov-fail-under=80'
      coverage-paths: 'coverage.xml'
      fail-on-quality-gate: 'true'
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codeql:
    name: codeql (ci)
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-codeql.yml@main
    with:
      languages: 'python,actions'
      queries-pack: 'security-extended'
      fail-on-alerts: true
      fail-on-severity: 'warning'

  gitleaks:
    name: gitleaks (ci)
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-gitleaks.yml@main
    with:
      environment-name: ci
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  actionlint:
    name: actionlint (ci)
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-actionlint.yml@main
    with:
      environment-name: ci

  yamllint:
    name: yamllint (ci)
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-yamllint.yml@main
    with:
      environment-name: ci

  # Requiere spark-match-01-devops#321. Cablear esta receta destapo que
  # apuntaba a `aquasecurity/trivy-action@0.36.0`, un tag que no existe (los de
  # ese repositorio llevan prefijo `v`), asi que nunca habia resuelto: cero runs
  # historicos en toda la organizacion. Nadie lo vio porque la receta no tenia
  # consumidores.
  #
  # Cierra parcialmente la solicitud R4 del ROADMAP. Lo que R4 pedia era
  # escanear la IMAGEN antes del push a ECR; eso hoy no se puede: la receta no
  # acepta secrets ni hace login a AWS, asi que no puede bajar una imagen de un
  # ECR privado. Ver ROADMAP-2026-08.md R4 para lo que falta.
  #
  # Lo que si cubre este escaneo de filesystem, y no cubria nada antes: CVEs de
  # las dependencias Python resueltas en uv.lock, y misconfigs del Dockerfile.
  # Sobre la imagen final quedan sin mirar las CVEs del sistema base.
  #
  # scanners sin `secret` a proposito: gitleaks corre en este mismo CI sobre
  # todo el historial, y el secret scanning nativo de GitHub esta activo. Un
  # tercer escaner de secretos solo anade hallazgos duplicados.
  #
  # ignore-unfixed: true + severity CRITICAL,HIGH => solo rompe el job por algo
  # que tiene arreglo publicado. Un CVE sin fix no es accionable y bloquear
  # merges por el solo ensena al equipo a ignorar el check.
  #
  # format table y no sarif: el paso `summary` de la receta solo imprime la
  # configuracion, no los hallazgos, asi que con sarif un job en rojo no diria
  # por que sin abrir la pestana Security. En tabla sale en el log del propio
  # job.
  trivy:
    name: trivy (ci)
    uses: spark-match/spark-match-01-devops/.github/workflows/reusable-trivy.yml@main
    with:
      scan-type: fs
      scan-ref: .
      scanners: vuln,misconfig
      severity: CRITICAL,HIGH
      ignore-unfixed: true
      format: table

  evals:
    name: evals (mock mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run evals (mock mode)
        run: uv run python -m evals.runner --mode mock
