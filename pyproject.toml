[project]
name = "spark-match-agent"
version = "0.3.0"
description = "Spark Match - Deep Agent for vocational guidance and career planning"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Spark Match Team" }]
dependencies = [
    # Deep Agents (harness + LangGraph runtime). Upper bounds pin the
    # LangChain cluster: deepagents 0.7.0 removes StoreBackend(runtime=),
    # which Sprint 6's memory work depends on.
    "deepagents>=0.6.12,<0.7",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    # LangChain AWS integration (Bedrock)
    "langchain-aws>=1.6.1",
    # AG-UI protocol for LangGraph (frontend streaming)
    "ag-ui-langgraph>=0.0.11",
    # Long-term memory (profile extraction from conversations)
    "langmem>=0.0.30",
    # FastAPI + SSE
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sse-starlette>=2.2.0",
    # Settings management
    "pydantic-settings>=2.8.0",
    # HTTP client (for tools)
    "httpx>=0.28.0",
    # Web search: Tavily (primary) + DuckDuckGo (fallback). 0.7.26 is the
    # first version exposing AsyncTavilyClient (Sprint 8, task 8.1).
    "tavily-python>=0.7.26",
    "duckduckgo-search>=7.0.0",
    # YAML frontmatter for career catalog + prompts
    "pyyaml>=6.0.3",
    "langgraph-checkpoint-sqlite>=3.1.1",
    # Perfil `postgres`: checkpointer + store sobre RDS. psycopg trae el
    # driver y el pool que usa AsyncPostgresSaver.from_conn_string; el extra
    # [binary] evita compilar libpq en la imagen ARM64 del Dockerfile.
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.10",
    "cachetools>=5.5",
    "boto3>=1.40",
    "slowapi>=0.1.9",
    # MCP server SDK (Sprint 8, task 8.5) -- exposes the 4 project tools
    # over the Model Context Protocol via MCPServer (mcp.server.mcpserver).
    # Note: the roadmap names "langchain-mcp-adapters" for this task, but
    # that package is a *client* (consumes external MCP servers into
    # LangChain) -- it has no server-side API. "mcp" is the underlying
    # protocol SDK that even langchain-mcp-adapters depends on for its own
    # example servers; it's the correct (and minimal) dependency for the
    # expose-only scope this task was narrowed to. >=2.0 because 2.0
    # renamed the 1.x FastMCP class to MCPServer and moved its module
    # (mcp.server.fastmcp -> mcp.server.mcpserver) -- confirmed by
    # installing and introspecting the real package, not assumed from
    # (outdated) docs.
    "mcp>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  UP: pyupgrade  B: bugbear  SIM: simplify
# ASYNC: async-correctness  PT: pytest-style  RET: return-statements  RUF: ruff-specific
select = [
    "E", "F", "I", "UP", "B", "SIM",
    "ASYNC", "PT", "RET", "RUF",
]
# RUF001/RUF002 (ambiguous characters in strings/docstrings) and RUF012
# (mutable class attributes) are too noisy given existing patterns.
# Re-enable once the codebase has been cleaned up.
ignore = ["RUF001", "RUF002", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert freely, allow long lines in test docstrings, and pytest fixtures
# commonly import without using (e.g. for fixture registration).
"tests/**/*.py" = ["S101", "PT004"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# Convention: tests/<domain>/<module>.py (no `test_` prefix on filenames).
# pytest discovery picks up files matching `python_files` recursively.
python_files = ["*.py"]
python_classes = ["Test*", "*Tool"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.14"
strict = true
# Extra strictness on top of `strict = true`:
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true

# Third-party libraries without py.typed markers. We can't fix upstream,
# so silence `import-untyped` for them. App code remains strictly checked.
[[tool.mypy.overrides]]
module = [
    "ag_ui_langgraph",
    "ag_ui_langgraph.*",
    "tavily",
    "tavily.*",
    "langmem",
    "deepagents",
    "deepagents.*",
    "slowapi",
    "slowapi.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "types-pyyaml>=6.0.12.20260518",
    "types-cachetools>=5.5",
    "boto3-stubs[secretsmanager,ssm]>=1.40",
]
